repos:
  - repo: local
    hooks:
      - id: biome-check
        name: biome
        entry: biome check --write
        language: system
        files: ^(src|biome\.json|package\.json|tailwind\.config\.js|vite\.config\.ts|tsconfig.*\.json)
        pass_filenames: false
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
